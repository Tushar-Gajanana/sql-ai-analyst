name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-admin-only
          POSTGRES_DB: retail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d retail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Initialize database
        env:
          PGPASSWORD: local-admin-only
        run: |
          psql -h localhost -U postgres -d retail -v ON_ERROR_STOP=1 -f sql/001_demo.sql
          psql -h localhost -U postgres -d retail -v ON_ERROR_STOP=1 -f sql/002_reader.sql
      - run: ruff check .
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://analyst:local-demo-only@localhost:5432/retail
