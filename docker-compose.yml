services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
      POSTGRES_DB: retail
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/001_demo.sql:/docker-entrypoint-initdb.d/001_demo.sql:ro
      - ./sql/002_reader.sql:/docker-entrypoint-initdb.d/002_reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
